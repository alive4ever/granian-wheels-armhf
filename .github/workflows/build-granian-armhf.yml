name: Building granian for armhf
run-name: ${{ github.actor }} is building granian for armhf
on:
  push:
    tags:
      - '*'
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        python_version: [3.11, 3.12, 3.13, 3.14, 3.15]
        target:
        - rust_target: armv7-unknown-linux-gnueabihf
          manylinux_tag: '2_28'
        - rust_target: armv7-unknown-linux-musleabihf
          manylinux_tag: musllinux_1_1
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Prepare qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-binfmt
      - name: Prepare repository
        uses: actions/checkout@v7
      - name: Prepare granian
        run: |
          git clone --filter=blob:none https://github.com/emmett-framework/granian
          cd granian
          git checkout v2.8.9
          cd ..
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
      - name: Build granian
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out ${{ github.workspace }}/dist -i python${{ matrix.python_version }}
          target: ${{ matrix.target.rust_target }}
          manylinux: ${{ matrix.target.manylinux_tag }}
          working-directory: ${{ github.workspace }}/granian
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-${{ matrix.python_version }}-${{ matrix.target.rust_target }}
          path: ${{ github.workspace }}/dist/
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Prepare repository
        uses: actions/checkout@v7
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          path: ${{ github.workspace }}/dist
          merge-multiple: true
      - name: Creating release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" ${{ github.workspace }}/dist/* --verify-tag --generate-notes || gh release upload --clobber "$TAG" ${{ github.workspace }}/dist/*
