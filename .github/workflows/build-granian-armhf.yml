name: Building granian for armhf
run-name: ${{ github.actor }} is building granian for armhf
on:
  push:
    tags:
      - '*'
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        python_version: [3.11, 3.12, 3.13, 3.14]
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Prepare qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-binfmt
      - name: Prepare repository
        uses: actions/checkout@v7
      - name: Prepare granian
        run: |
          git clone https://github.com/emmett-framework/granian
          cd granian
          git checkout v2.8.1
          cd ..
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
      - name: Build granian
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out ${{ github.workspace }}/dist -i python${{ matrix.python_version }}
          target: armv7-unknown-linux-gnueabihf
          manylinux: 2_28
          working-directory: ${{ github.workspace }}/granian
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-${{ matrix.deb_codename }}
          path: ${{ github.workspace }}/dist/
      - name: Creating release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" ${{ github.workspace }}/dist/* --verify-tag --generate-notes || gh release upload "$TAG" ${{ github.workspace }}/dist/*
