name: Building granian for armhf
run-name: ${{ github.actor }} is building granian for armhf
on:
  push:
    tags:
      - '*'
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        deb_codename: [trixie, bookworm]
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Prepare chroot
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap qemu-user-binfmt systemd-container debian-archive-keyring
          curl -L -O "http://archive.raspbian.org/raspbian/pool/main/r/raspbian-archive-keyring/raspbian-archive-keyring_20120528.4_all.deb"
          sudo dpkg --install ./raspbian-archive-keyring_20120528.4_all.deb
          sudo mmdebstrap --arch=armhf --setup-hook 'mkdir -p "$1"/usr/share/keyrings; cp -v /usr/share/keyrings/raspbian-archive-keyring.gpg "$1"/usr/share/keyrings/' --keyring /usr/share/keyrings/ --include='git curl sudo ca-certificates build-essential python3-venv python3 python3-dev cargo rustc' ${{ matrix.deb_codename }} /var/lib/machines/armhf-raspbian http://archive.raspbian.org/raspbian/
      - name: Prepare repository
        uses: actions/checkout@v7
      - name: Building granian
        run: |
          sudo systemd-nspawn --bind ${{ github.workspace }}:/tmp/host_workspace,rootidmap --bind-ro /etc/resolv.conf --hostname localhost --machine armhf-raspbian -- setarch arm sh /tmp/host_workspace/prepare.sh
          sudo systemd-nspawn --bind ${{ github.workspace }}:/tmp/host_workspace,rootidmap --bind-ro /etc/resolv.conf --hostname localhost --machine armhf-raspbian --user builder -- setarch arm sh /tmp/host_workspace/build.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-${{ matrix.deb_codename }}
          path: ${{ github.workspace }}/dist/
      - name: Creating release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" ${{ github.workspace }}/dist/* --verify-tag --generate-notes || gh release upload "$TAG" ${{ github.workspace }}/dist/*
